<!doctype html>
<!-- Source of example/web/og.png. Regenerate with: node scripts/og/render.js -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'GalleryMono'; src: url('../../example/assets/fonts/DejaVuSansMono.ttf'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: #0A0A0C; color: #F4F4F5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.09) 1.1px, transparent 1.2px);
    background-size: 24px 24px;
    mask-image: linear-gradient(110deg, rgba(0,0,0,0.25) 0%, #000 55%, #000 100%);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; right: -320px; top: -360px;
    background: radial-gradient(circle, rgba(245,196,81,0.24) 0%, rgba(245,196,81,0.07) 40%, transparent 68%);
  }
  .glow2 {
    position: absolute; width: 700px; height: 700px; left: -300px; bottom: -420px;
    background: radial-gradient(circle, rgba(183,128,10,0.16) 0%, transparent 65%);
  }
  .left { position: absolute; left: 72px; top: 68px; width: 520px; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: -0.2px; }
  .logo { width: 44px; height: 44px; filter: drop-shadow(0 0 18px rgba(245,196,81,0.35)); }
  h1 {
    margin-top: 54px; font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -3px;
  }
  h1 .gold {
    background: linear-gradient(100deg, #FDE68A 0%, #F5C451 45%, #D99A1E 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { margin-top: 22px; font-size: 22px; line-height: 1.45; color: #A1A1AA; width: 440px; }
  .chips { position: absolute; left: 72px; bottom: 56px; width: 470px; display: flex; flex-wrap: wrap; gap: 10px; z-index: 3; }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 16px; font-weight: 500; color: #D4D4D8;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  }
  .chip b { color: #F5C451; font-weight: 600; }

  .wall {
    position: absolute; left: 560px; top: -6px; z-index: 1;
    display: grid; grid-template-columns: 200px 200px 200px; grid-auto-rows: 52px; gap: 14px;
    transform: perspective(2000px) rotateY(-14deg) rotateX(8deg) rotateZ(-6deg);
    transform-origin: 50% 50%;
  }
  .tile {
    position: relative; overflow: hidden; border-radius: 18px; background: #0A0A0C;
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 30px 60px rgba(0,0,0,0.55);
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile.hero {
    border-color: rgba(245,196,81,0.55);
    box-shadow: 0 0 0 6px rgba(245,196,81,0.05), 0 0 80px rgba(245,196,81,0.25), 0 30px 60px rgba(0,0,0,0.6);
  }
  .fade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(90deg, #0A0A0C 0%, #0A0A0C 40%, rgba(10,10,12,0.6) 46%, rgba(10,10,12,0) 54%),
      linear-gradient(0deg, rgba(10,10,12,0.6) 0%, rgba(10,10,12,0) 22%);
  }
  .url { z-index: 3; position: absolute; left: 74px; bottom: 160px; font-size: 18px; color: #71717A; font-weight: 500; }
</style>
</head>
<body>
  <div class="dots"></div><div class="glow"></div><div class="glow2"></div>
  <div class="wall">
    <div class="tile" style="grid-column:1; grid-row:1 / span 3"><img src="shots/grid.jpg" alt=""></div>
    <div class="tile hero" style="grid-column:2 / span 2; grid-row:1 / span 5"><img src="shots/globe.jpg" alt="" style="object-fit:contain"></div>
    <div class="tile" style="grid-column:1; grid-row:4 / span 2"><img src="shots/caret.jpg" alt="" style="object-position:0 50%"></div>
    <div class="tile" style="grid-column:1; grid-row:6 / span 2"><img src="shots/marquee.jpg" alt=""></div>
    <div class="tile" style="grid-column:1; grid-row:8 / span 5"><img src="shots/lamp-lava.jpg" alt=""></div>
    <div class="tile" style="grid-column:2; grid-row:6 / span 3"><img src="shots/blur.jpg" alt="" style="object-position:50% 0"></div>
    <div class="tile" style="grid-column:2; grid-row:9 / span 4"><img src="shots/feed.jpg" alt="" style="object-position:50% 0"></div>
    <div class="tile" style="grid-column:3; grid-row:6 / span 6"><img src="shots/lamp-neon.jpg" alt=""></div>
  </div>
  <div class="fade"></div>
  <div class="left">
    <div class="brand"><img class="logo" src="../../example/web/favicon.svg" alt="">Golden Components</div>
    <h1>Golden <span class="gold">Flutter</span><br>components</h1>
    <p class="sub">Polished, animated components built with nothing but the widgets library.<br>No Material. No Cupertino.</p>
  </div>
  <div class="url">flutter-golden-components.vercel.app</div>
  <div class="chips">
    <div class="chip"><b>Globe</b></div>
    <div class="chip"><b>GooBlobs</b></div>
    <div class="chip">EndlessGlideGrid</div>
    <div class="chip">Marquee</div>
    <div class="chip">LiveFeed</div>
    <div class="chip">BlurFade</div>
    <div class="chip">SmoothCaret</div>
  </div>
</body>
</html>
