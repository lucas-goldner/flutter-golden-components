<!doctype html>
<!-- Source of example/web/og.png. Regenerate with: node scripts/og/render.js -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'GalleryMono'; src: url('../../example/assets/fonts/DejaVuSansMono.ttf'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: #0A0A0C; color: #F4F4F5;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.09) 1.1px, transparent 1.2px);
    background-size: 24px 24px;
    mask-image: linear-gradient(110deg, rgba(0,0,0,0.25) 0%, #000 55%, #000 100%);
  }
  .glow {
    position: absolute; width: 900px; height: 900px; right: -320px; top: -360px;
    background: radial-gradient(circle, rgba(245,196,81,0.24) 0%, rgba(245,196,81,0.07) 40%, transparent 68%);
  }
  .glow2 {
    position: absolute; width: 700px; height: 700px; left: -300px; bottom: -420px;
    background: radial-gradient(circle, rgba(183,128,10,0.16) 0%, transparent 65%);
  }
  .left { position: absolute; left: 72px; top: 68px; width: 520px; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: -0.2px; }
  .logo { width: 44px; height: 44px; filter: drop-shadow(0 0 18px rgba(245,196,81,0.35)); }
  h1 {
    margin-top: 54px; font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -3px;
  }
  h1 .gold {
    background: linear-gradient(100deg, #FDE68A 0%, #F5C451 45%, #D99A1E 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { margin-top: 22px; font-size: 22px; line-height: 1.45; color: #A1A1AA; width: 440px; }
  .chips { position: absolute; left: 72px; bottom: 56px; width: 470px; display: flex; flex-wrap: wrap; gap: 10px; z-index: 3; }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 16px; font-weight: 500; color: #D4D4D8;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  }
  .chip b { color: #F5C451; font-weight: 600; }

  .shot { position: absolute; display: block; }
  .globe {
    width: 620px; left: 610px; top: 6px;
    mask-image: radial-gradient(circle closest-side, #000 88%, rgba(0,0,0,0.55) 92%, transparent 100%);
  }
  .globe-glow {
    position: absolute; width: 680px; height: 680px; left: 580px; top: -24px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,196,81,0.18) 38%, rgba(245,196,81,0.06) 48%, transparent 62%);
  }
  .lamp { mask-image: radial-gradient(ellipse 48% 50% at 50% 50%, #000 55%, transparent 100%); }
  .lamp.lava { height: 540px; left: 505px; bottom: -40px; z-index: 2; }
  .lamp.neon { height: 380px; right: -44px; bottom: -24px; z-index: 1; opacity: 0.95; }
  .url { z-index: 3; position: absolute; left: 74px; bottom: 160px; font-size: 18px; color: #71717A; font-weight: 500; }
</style>
</head>
<body>
  <div class="dots"></div><div class="glow2"></div>
  <div class="globe-glow"></div>
  <img class="shot globe" src="shots/globe.jpg" alt="">
  <img class="shot lamp neon" src="shots/lamp-neon.jpg" alt="">
  <img class="shot lamp lava" src="shots/lamp-lava.jpg" alt="">
  <div class="left">
    <div class="brand"><img class="logo" src="../../example/web/favicon.svg" alt="">Golden Components</div>
    <h1>Golden <span class="gold">Flutter</span><br>components</h1>
    <p class="sub">Polished, animated components built with nothing but the widgets library.<br>No Material. No Cupertino.</p>
  </div>
  <div class="url">flutter-golden-components.vercel.app</div>
  <div class="chips">
    <div class="chip"><b>Globe</b></div>
    <div class="chip"><b>GooBlobs</b></div>
    <div class="chip">EndlessGlideGrid</div>
    <div class="chip">Marquee</div>
    <div class="chip">LiveFeed</div>
    <div class="chip">BlurFade</div>
    <div class="chip">SmoothCaret</div>
  </div>
</body>
</html>
