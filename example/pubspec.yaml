name: golden_gallery
description: "Interactive gallery for flutter_golden_components (web, iOS and macOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_golden_components:
    path: ../
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: GalleryMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
