name: flutter_golden_components
description: "High quality, animated Flutter components built using only the widgets library (no Material or Cupertino)."
version: 0.1.0
homepage: https://github.com/lucas-goldner/flutter-golden-components
repository: https://github.com/lucas-goldner/flutter-golden-components

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Component sources ship as assets so the gallery can show and copy them.
  assets:
    - lib/src/aurora_backdrop/
    - lib/src/blur_fade/
    - lib/src/cylinder_carousel/
    - lib/src/digit_roll/
    - lib/src/endless_glide_grid/
    - lib/src/glide_highlight/
    - lib/src/globe/
    - lib/src/goo_blobs/
    - lib/src/halo_dropzone/
    - lib/src/jump_text/
    - lib/src/kinetic_line/
    - lib/src/live_feed/
    - lib/src/magnify_dock/
    - lib/src/marquee/
    - lib/src/metal_button/
    - lib/src/morph_card/
    - lib/src/notch_card/
    - lib/src/pill_select/
    - lib/src/shapeshift_drawer/
    - lib/src/smooth_caret/
    - lib/src/step_flow/
    - lib/src/stretch_slider/
